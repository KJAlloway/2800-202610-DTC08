<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
</head>
<body>
    <h1>Item Search</h1>
    <form>
        <label for="itemSearch">
            
            <!-- oninput triggers the function when input changes (add or delete). this.value is the text in the box -->
            <input type="text" id="itemSearch" oninput="parseSearch(this.value)">
        </label>
    </form>

    <ul id="results"></ul>

    <script>
        // Called by search bar after every input
        function parseSearch(text) {
            addFoundItemToResults(text, getData())
        }

        // gets and normalizes data from DB
        function getData() {
            // array "test" would be sourced from the database
            let test = [
                "test1",
                "TEST2",
                "Te St 3",
                "   TesT  4",
                "tes t5 ",
                "peas", "beans", "soup", "rock", "piranhas"
            ]
            for (let i = 0; i < test.length; ++i) {
                test[i] = normalizeString(test[i])
            }
            return test
        }

        // adds results to UL below search bar
        function addFoundItemToResults(text, data) {

            // clears the old data in result when called
            let results = document.getElementById("results")
            while (results.hasChildNodes()) {
                results.removeChild(results.firstChild);
            }

            // normalizes the input text
            text = normalizeString(text)
            for (let i = 0; i < data.length; ++i) {

                // prevents all data from being returned by requiring a len != 0
                if (text.length !== 0 && data[i].includes(text)) {

                    // Create and append a new element with the text that matches. Could be of any element type.
                    const node = document.createElement("li");
                    const textNode = document.createTextNode(data[i]);
                    node.appendChild(textNode);
                    results.appendChild(node);
                }
            }
        }

        // Basic text normalization function
        function normalizeString(string) {
            return string.toLowerCase().replaceAll(" ", "")
        }
    </script>
</body>
</html>
