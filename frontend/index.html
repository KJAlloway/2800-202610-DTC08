<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Finder</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon_io/site.webmanifest">
    <script type="module" src="js/app.js" defer></script>
</head>
<body>
<main class="page-shell">
    <section class="hero-section" aria-labelledby="page-title">
        <p class="eyebrow">Cabbage Patch</p>
        <h1 id="page-title">Find hard-to-find ingredients near you.</h1>
        <p class="hero-copy">
            Search for an ingredient
        </p>

        <form id="vendor-search-form" class="search-form">
            <label for="ingredient-input">Ingredient</label>
            <input id="ingredient-input" name="ingredient" type="search" placeholder="Oaxaca cheese" required>

            <label for="location-input">Location</label>
            <input id="location-input" name="location" type="search" placeholder="Vancouver, BC">

            <button type="submit">Search vendors</button>
        </form>
    </section>

    <section class="results-section" aria-labelledby="results-title">
        <h2 id="results-title">Vendor results</h2>
        <p id="search-summary" class="muted-copy">Run a search to test the clean API path.</p>
        <div id="vendor-results" class="vendor-list"></div>
    </section>
</main>
</body>
</html>
