<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>API Test</title>

<body>
    <h1>Item Search</h1>
    <form>
        <label for="itemSearch">
            <input type="text" id="itemSearch" oninput="parseSearch(this.value)">
        </label>
    </form>

    <ul id="results"></ul>

    <script type="module" src="dbTest.js"></script>


    <script>
        function parseSearch(text) {
            addFoundItemToResults(text, getData())
        }

        function getData() {
            // DB query returns array of ingredient names
            let test = [
                "test1",
                "TEST2",
                "Te St 3",
                "   TesT  4",
                "tes t5 ",
                "peas", "beans", "soup", "rock", "piranhas"
            ]
            for (let i = 0; i < test.length; ++i) {
                test[i] = normalizeString(test[i])
            }
            return test
        }

        function addFoundItemToResults(text, data) {
            let results = document.getElementById("results")
            while (results.hasChildNodes()) {
                results.removeChild(results.firstChild);
            }

            text = normalizeString(text)
            for (let i = 0; i < data.length; ++i) {
                if (text.length !== 0 && data[i].includes(text)) {
                    const node = document.createElement("li");
                    const textNode = document.createTextNode(data[i]);
                    node.appendChild(textNode);
                    results.appendChild(node);
                }
            }
        }

        function normalizeString(string) {
            return string.toLowerCase().replaceAll(" ", "")
        }
